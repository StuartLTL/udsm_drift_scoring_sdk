<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" width="640" height="420" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <title>CHAPPiE zone depth grid</title>
  <desc>A scored zone split into length steps along the track and depth bands toward the wall, with an overshoot strip beyond the deepest band.</desc>

  <style>
    .lbl   { font-size: 12px; fill: #6b7280; }
    .lbl-b { font-size: 12px; fill: #374151; font-weight: 600; }
    .cell  { font-size: 11px; fill: #1f2937; font-family: ui-monospace, Consolas, monospace; }
    .cellw { font-size: 11px; fill: #ffffff; font-family: ui-monospace, Consolas, monospace; }
    .note  { font-size: 11px; fill: #6b7280; }
    @media (prefers-color-scheme: dark) {
      .lbl   { fill: #9ca3af; }
      .lbl-b { fill: #e5e7eb; }
      .cell  { fill: #111827; }
      .note  { fill: #9ca3af; }
      .track { fill: #374151 !important; }
      .wall  { fill: #4b5563 !important; }
    }
  </style>

  <!-- track surface -->
  <rect class="track" x="60" y="60" width="470" height="40" fill="#e5e7eb"/>
  <text class="lbl" x="64" y="52">track side (racing line)</text>

  <!-- depth bands: 3 lengths x 3 depths -->
  <!-- depth 1 (shallow, blue) -->
  <rect x="60"  y="100" width="150" height="52" fill="#4059ff" opacity="0.85"/>
  <rect x="215" y="100" width="150" height="52" fill="#4059ff" opacity="0.85"/>
  <rect x="370" y="100" width="160" height="52" fill="#4059ff" opacity="0.85"/>
  <text class="cellw" x="82"  y="131">zone_1_1_1</text>
  <text class="cellw" x="237" y="131">zone_1_2_1</text>
  <text class="cellw" x="397" y="131">zone_1_3_1</text>

  <!-- depth 2 (cyan) -->
  <rect x="60"  y="157" width="150" height="52" fill="#22d3ee" opacity="0.9"/>
  <rect x="215" y="157" width="150" height="52" fill="#22d3ee" opacity="0.9"/>
  <rect x="370" y="157" width="160" height="52" fill="#22d3ee" opacity="0.9"/>
  <text class="cell" x="82"  y="188">zone_1_1_2</text>
  <text class="cell" x="237" y="188">zone_1_2_2</text>
  <text class="cell" x="397" y="188">zone_1_3_2</text>

  <!-- depth 3 (yellow) -->
  <rect x="60"  y="214" width="150" height="52" fill="#facc15" opacity="0.95"/>
  <rect x="215" y="214" width="150" height="52" fill="#facc15" opacity="0.95"/>
  <rect x="370" y="214" width="160" height="52" fill="#facc15" opacity="0.95"/>
  <text class="cell" x="82"  y="245">zone_1_1_3</text>
  <text class="cell" x="237" y="245">zone_1_2_3</text>
  <text class="cell" x="397" y="245">zone_1_3_3</text>

  <!-- overshoot strip -->
  <rect x="60"  y="271" width="150" height="34" fill="#ef4444" opacity="0.9"/>
  <rect x="215" y="271" width="150" height="34" fill="#ef4444" opacity="0.9"/>
  <rect x="370" y="271" width="160" height="34" fill="#ef4444" opacity="0.9"/>
  <text class="cellw" x="76"  y="293">overshoot_1_1</text>
  <text class="cellw" x="231" y="293">overshoot_1_2</text>
  <text class="cellw" x="391" y="293">overshoot_1_3</text>

  <!-- wall -->
  <rect class="wall" x="60" y="309" width="470" height="18" fill="#9ca3af"/>
  <text class="lbl" x="64" y="342">wall</text>

  <!-- depth axis -->
  <line x1="44" y1="104" x2="44" y2="300" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text class="lbl-b" x="8" y="200" transform="rotate(-90 18,200)">depth →</text>

  <!-- length axis -->
  <line x1="64" y1="372" x2="526" y2="372" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text class="lbl-b" x="250" y="392">length → (direction of travel)</text>

  <!-- length step labels -->
  <text class="lbl" x="120" y="366">L1 entry</text>
  <text class="lbl" x="282" y="366">L2 mid</text>
  <text class="lbl" x="437" y="366">L3 exit</text>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9ca3af"/>
    </marker>
  </defs>

  <!-- side note -->
  <text class="note" x="548" y="120">Each cell is</text>
  <text class="note" x="548" y="136">a separate</text>
  <text class="note" x="548" y="152">mesh object.</text>

  <text class="note" x="548" y="188">Deepest band</text>
  <text class="note" x="548" y="204">reached at each</text>
  <text class="note" x="548" y="220">length = that</text>
  <text class="note" x="548" y="236">step's score.</text>

  <text class="note" x="548" y="278">Touching red</text>
  <text class="note" x="548" y="294">halves the step</text>
  <text class="note" x="548" y="310">and deducts.</text>
</svg>
